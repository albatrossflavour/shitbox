# Waveshare 7" HDMI touchscreen calibration
# Deploy to: /etc/X11/xorg.conf.d/99-waveshare-touchscreen.conf
#
# The transformation matrix swaps X and Y axes (90° rotation)
# to match the screen's physical orientation on the dash.

Section "InputClass"
    Identifier "Waveshare Touchscreen Calibration"
    MatchProduct "wch.cn USB2IIC_CTP_CONTROL"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "TransformationMatrix" "0 1 0 1 0 0 0 0 1"
EndSection
