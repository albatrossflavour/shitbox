<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>shitbox</title>
  <link rel="stylesheet" href="/static/vendor/tailwind.min.css">
  <link rel="stylesheet" href="/static/vendor/leaflet.css">
  <style>
    html, body { margin: 0; padding: 0; width: 800px; height: 480px; overflow: hidden; background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    * { cursor: none !important; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    .num { font-variant-numeric: tabular-nums; font-weight: 600; }
    .card { background: #161b22; border: 1px solid #21262d; }
    .badge { padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; display: inline-block; }
    .ev-HIGH_G { background: #da3633; color: #fff; }
    .ev-HARD_BRAKE { background: #f85149; color: #fff; }
    .ev-BIG_CORNER { background: #d29922; color: #000; }
    .ev-ROUGH_ROAD { background: #8957e5; color: #fff; }
    .ev-MANUAL, .ev-BUTTON { background: #238636; color: #fff; }
    .ev-BOOT { background: #1f6feb; color: #fff; }
    #map { background: #0d1117; width: 100%; height: 100%; }
    .stale { color: #da3633; }
    .bg-red-700 { background: #b91c1c; color: #fff; }
    .bg-yellow-600 { background: #ca8a04; color: #000; }
    .bg-green-700 { background: #15803d; color: #fff; }
  </style>
</head>
<body x-data="dashboard()" x-init="init()" style="display: flex; flex-direction: column; width: 800px; height: 480px; overflow: hidden;">

  <!-- TOP STRIP (h: 72px) -->
  <header class="card flex items-center gap-3 px-4" style="height: 72px; flex-shrink: 0;">
    <!-- Speed: dominant -->
    <div class="num" style="font-size: 64px; line-height: 1; min-width: 120px; text-align: right;">
      <span x-text="speed"></span>
    </div>
    <div class="text-gray-400" style="font-size: 13px; padding-top: 4px;">km/h</div>

    <!-- Divider -->
    <div style="width: 1px; height: 40px; background: #21262d; flex-shrink: 0;"></div>

    <!-- Active driver -->
    <div style="min-width: 100px; flex-shrink: 0;">
      <div class="text-gray-400" style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;">Driver</div>
      <div class="cursor-pointer text-gray-100 hover:text-white font-semibold"
           style="font-size: 15px;"
           @click="openDriverModal()"
           x-text="activeDriver || '---'"></div>
    </div>

    <!-- GPS + sync badges -->
    <div style="display: flex; flex-direction: column; gap: 3px; flex-shrink: 0;">
      <span class="badge" :class="gpsBadgeClass" x-text="gpsBadge"></span>
      <span class="badge" :class="syncBadgeClass" x-text="syncBadge"></span>
    </div>

    <!-- Spacer -->
    <div style="flex: 1;"></div>

    <!-- Action buttons + success flash -->
    <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
      <button @click="openMap()"
              style="cursor: pointer; background: #161b22; border: 1px solid #30363d;
                     color: #58a6ff; font-size: 20px; font-weight: 700;
                     padding: 6px 14px; border-radius: 4px; min-height: 44px;">MAP</button>
      <button @click="openNoteModal()"
              style="cursor: pointer; background: #161b22; border: 1px solid #30363d;
                     color: #e6edf3; font-size: 20px; font-weight: 700;
                     padding: 6px 14px; border-radius: 4px; min-height: 44px;">+ Note</button>
      <button @click="openFuelModal()"
              style="cursor: pointer; background: #161b22; border: 1px solid #30363d;
                     color: #e6edf3; font-size: 20px; font-weight: 700;
                     padding: 6px 14px; border-radius: 4px; min-height: 44px;">+ Fuel</button>
      <span class="badge" x-show="successMsg" x-text="successMsg"
            style="background: #238636; color: #fff;"></span>
    </div>
  </header>

  <!-- MAIN CENTRE (fills remaining height between header and footer) -->
  <main style="flex: 1; display: flex; overflow: hidden;">

    <!-- Left: G-gauge -->
    <div class="card" style="width: 360px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 4px;">
      <canvas id="ggauge" width="350" height="260"></canvas>
    </div>

    <!-- Right: data tiles + MAP button -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 8px; overflow: hidden;">

      <!-- Temp row -->
      <div style="display: flex; gap: 6px; flex-shrink: 0;">
        <div class="card" style="flex: 1; padding: 8px;">
          <div class="text-gray-400" style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;">Cabin Temp</div>
          <div class="num" style="font-size: 28px;"><span x-text="imuTemp"></span> <span class="text-gray-400" style="font-size: 14px;">&deg;C</span></div>
        </div>
        <div class="card" style="flex: 1; padding: 8px;">
          <div class="text-gray-400" style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;">SoC Temp</div>
          <div class="num" style="font-size: 28px;"><span x-text="socTemp"></span> <span class="text-gray-400" style="font-size: 14px;">&deg;C</span></div>
        </div>
      </div>

      <!-- Waypoint distance + Bearing row -->
      <div style="display: flex; gap: 6px; flex: 1;">
        <div class="card" style="flex: 1; padding: 8px; display: flex; flex-direction: column; justify-content: center;">
          <div class="text-gray-400" style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;">Next WP</div>
          <div class="num" style="font-size: 20px;" x-text="waypointText"></div>
        </div>
        <div class="card" style="flex: 1; padding: 8px; display: flex; flex-direction: column; justify-content: center;">
          <div class="text-gray-400" style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;">Bearing</div>
          <div class="num" style="font-size: 20px;" x-text="bearingText"></div>
        </div>
      </div>

      <!-- Current G + Time row -->
      <div style="display: flex; gap: 6px; flex: 1;">
        <div class="card" style="flex: 1; padding: 8px; display: flex; flex-direction: column; justify-content: center;">
          <div class="text-gray-400" style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;">Current G</div>
          <div class="num" style="font-size: 28px;" x-text="(Math.hypot(gx, gy)).toFixed(2) + 'g'"></div>
        </div>
        <div class="card" style="flex: 1; padding: 8px; display: flex; flex-direction: column; justify-content: center;">
          <div class="text-gray-400" style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;">Time</div>
          <div class="num" style="font-size: 28px;" x-text="new Date(now).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12: false})"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- BOTTOM STRIP: 5-item event ticker + timelapse thumbnail (h: 120px) -->
  <footer class="card" style="height: 120px; flex-shrink: 0; padding: 6px 10px; overflow: hidden; display: flex; gap: 8px;">
    <!-- Event ticker -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden;">
      <template x-for="ev in events" :key="ev.ts || ev.timestamp">
        <div style="display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden;">
          <span class="badge" :class="'ev-' + ev.type"
                :style="`background:${EVENT_COLOURS[ev.type] || '#8b949e'}`"
                x-text="ev.type"></span>
          <span class="num text-gray-300" style="font-size: 13px;"
                x-text="(ev.peak_g || 0).toFixed(1) + 'g'"></span>
          <span class="text-gray-400" style="font-size: 12px;"
                x-text="relativeTime(ev.ts || ev.timestamp)"></span>
        </div>
      </template>
      <div x-show="events.length === 0" class="text-gray-400" style="font-size: 13px;">No events yet</div>
    </div>
    <!-- Timelapse thumbnail -->
    <div x-show="timelapseUrl" style="flex-shrink: 0; width: 106px; height: 106px; cursor: pointer;"
         @click="openTimelapse()">
      <img :src="timelapseUrl" alt="timelapse"
           style="width: 106px; height: 106px; object-fit: cover; border-radius: 4px; border: 1px solid #21262d;">
    </div>
  </footer>

  <!-- Timelapse fullscreen overlay (z-index 100, same level as map) -->
  <div x-show="showTimelapse"
       x-cloak
       style="position: fixed; inset: 0; z-index: 100; background: #0d1117; display: flex; align-items: center; justify-content: center;"
       @click="closeTimelapse()">
    <button @click="closeTimelapse()"
            style="position: absolute; top: 12px; right: 16px; z-index: 110;
                   background: #161b22; border: 1px solid #21262d; color: #e6edf3;
                   padding: 6px 14px; border-radius: 4px; font-size: 18px;
                   cursor: pointer; font-weight: 700;">&times; Close</button>
    <img :src="timelapseUrl" alt="timelapse"
         style="max-width: 100%; max-height: 100%; object-fit: contain;">
  </div>

  <!-- MAP overlay (z-index 100, reuses existing #map div + Leaflet instance) -->
  <div x-show="showMap"
       x-cloak
       style="position: fixed; inset: 0; z-index: 100; background: #0d1117;"
       @click.self="closeMap()">
    <!-- Close button top-right so tap-to-dismiss on dark edges still works -->
    <button @click="closeMap()"
            style="position: absolute; top: 12px; right: 16px; z-index: 110;
                   background: #161b22; border: 1px solid #21262d; color: #e6edf3;
                   padding: 6px 14px; border-radius: 4px; font-size: 18px;
                   cursor: pointer; font-weight: 700;">&times; Close</button>
    <div id="map" style="position: absolute; inset: 0;"></div>
  </div>

  <!-- Alert overlay (z-index 150, above map overlay, below modals) -->
  <div x-show="alertOverlay"
       x-cloak
       style="position: fixed; inset: 0; z-index: 150; display: flex; align-items: center; justify-content: center; pointer-events: none;"
       :style="alertOverlay ? `background:${alertOverlay.colour}CC` : ''">
    <div class="text-white font-bold"
         style="font-size: 52px; text-align: center; padding: 24px; text-shadow: 0 2px 8px rgba(0,0,0,0.6);"
         x-text="alertOverlay ? alertOverlay.message : ''"></div>
  </div>

  <!-- Field Note modal -->
  <div x-show="showNoteModal" x-cloak
       @keydown.escape.window="showNoteModal = false"
       style="position: fixed; inset: 0; background: rgba(13,17,23,0.85);
              display: flex; align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: #161b22; border: 1px solid #21262d; border-radius: 8px;
                padding: 24px; max-width: 480px; width: 90%; min-height: 320px;">
      <h2 style="font-size: 20px; font-weight: 600; margin: 0 0 16px; color: #e6edf3;">Field Note</h2>

      <textarea x-model="noteBody" rows="4" placeholder="What happened?"
                style="width: 100%; background: #0d1117; border: 1px solid #21262d;
                       color: #e6edf3; border-radius: 4px; padding: 12px;
                       font-size: 16px; font-family: inherit; resize: vertical;"></textarea>

      <select x-model="noteEventId"
              :disabled="events.length === 0"
              style="width: 100%; background: #0d1117; border: 1px solid #21262d;
                     color: #e6edf3; border-radius: 4px; padding: 12px; margin-top: 12px;
                     font-size: 16px; min-height: 44px;">
        <option value="" x-text="events.length === 0 ? 'No recent events' : 'No event pin'"></option>
        <template x-for="ev in events.slice(0, 10)" :key="ev.id">
          <option :value="ev.id" x-text="(ev.type || 'EVENT') + ' @ ' + ev.timestamp"></option>
        </template>
      </select>

      <div style="margin-top: 12px; font-size: 12px; font-weight: 600;">
        <span x-show="gpsHasFix" style="color: #8b949e;">Location captured (3D fix)</span>
        <span x-show="!gpsHasFix && gpsStaleMinutes > 0" style="color: #ca8a04;"
              x-text="'Location from ' + gpsStaleMinutes + ' minutes ago'"></span>
        <span x-show="!gpsHasFix && gpsStaleMinutes === 0" style="color: #ca8a04;">No GPS fix available</span>
      </div>

      <div x-show="errorMsg" x-text="errorMsg"
           style="margin-top: 12px; color: #da3633; font-size: 12px; font-weight: 600;"></div>

      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px;">
        <button @click="showNoteModal = false"
                style="background: none; color: #8b949e; padding: 8px 16px;
                       border: none; border-radius: 4px; cursor: pointer;">Close</button>
        <button @click.prevent="saveNote()" :disabled="savingNote || !noteBody.trim()"
                :style="(savingNote || !noteBody.trim())
                  ? 'background: #21262d; color: #8b949e; cursor: not-allowed; padding: 8px 16px; border: none; border-radius: 4px;'
                  : 'background: #1f6feb; color: #fff; cursor: pointer; padding: 8px 16px; border: none; border-radius: 4px; font-weight: 600;'"
                x-text="savingNote ? 'Saving...' : 'Save Note'"></button>
      </div>
    </div>
  </div>

  <!-- Fuel Stop modal -->
  <div x-show="showFuelModal" x-cloak
       @keydown.escape.window="showFuelModal = false"
       style="position: fixed; inset: 0; background: rgba(13,17,23,0.85);
              display: flex; align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: #161b22; border: 1px solid #21262d; border-radius: 8px;
                padding: 24px; max-width: 480px; width: 90%; min-height: 320px;">
      <h2 style="font-size: 20px; font-weight: 600; margin: 0 0 16px; color: #e6edf3;">Fuel Stop</h2>

      <input type="number" step="0.1" min="0" x-model="fuelVolume" placeholder="Litres"
             style="width: 100%; background: #0d1117; border: 1px solid #21262d;
                    color: #e6edf3; border-radius: 4px; padding: 12px; font-size: 16px;
                    min-height: 44px;" />

      <input type="number" step="0.01" min="0" x-model="fuelCost"
             placeholder="Cost (AUD) — private, never synced"
             style="width: 100%; background: #0d1117; border: 1px solid #21262d;
                    color: #e6edf3; border-radius: 4px; padding: 12px; font-size: 16px;
                    min-height: 44px; margin-top: 12px;" />

      <input type="number" step="1" min="0" x-model="fuelOdo"
             placeholder="Odometer (km) — optional"
             style="width: 100%; background: #0d1117; border: 1px solid #21262d;
                    color: #e6edf3; border-radius: 4px; padding: 12px; font-size: 16px;
                    min-height: 44px; margin-top: 12px;" />

      <div style="margin-top: 12px; font-size: 12px; font-weight: 600;">
        <span x-show="gpsHasFix" style="color: #8b949e;">Location captured (3D fix)</span>
        <span x-show="!gpsHasFix && gpsStaleMinutes > 0" style="color: #ca8a04;"
              x-text="'Location from ' + gpsStaleMinutes + ' minutes ago'"></span>
        <span x-show="!gpsHasFix && gpsStaleMinutes === 0" style="color: #ca8a04;">No GPS fix available</span>
      </div>

      <div x-show="errorMsg" x-text="errorMsg"
           style="margin-top: 12px; color: #da3633; font-size: 12px; font-weight: 600;"></div>

      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px;">
        <button @click="showFuelModal = false"
                style="background: none; color: #8b949e; padding: 8px 16px;
                       border: none; border-radius: 4px; cursor: pointer;">Close</button>
        <button @click.prevent="saveFuel()" :disabled="savingFuel || !(parseFloat(fuelVolume) > 0)"
                :style="(savingFuel || !(parseFloat(fuelVolume) > 0))
                  ? 'background: #21262d; color: #8b949e; cursor: not-allowed; padding: 8px 16px; border: none; border-radius: 4px;'
                  : 'background: #1f6feb; color: #fff; cursor: pointer; padding: 8px 16px; border: none; border-radius: 4px; font-weight: 600;'"
                x-text="savingFuel ? 'Saving...' : 'Log Fuel Stop'"></button>
      </div>
    </div>
  </div>

  <!-- Driver stats modal -->
  <div x-show="showDriverModal"
       x-cloak
       @keydown.escape.window="showDriverModal = false"
       class="fixed inset-0 flex items-center justify-center bg-black/70"
       style="z-index: 1000;"
       @click.self="showDriverModal = false">
    <div class="bg-gray-900 border border-gray-700 rounded-lg p-6 w-full max-w-md">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold text-gray-100">Driver</h2>
        <button @click="showDriverModal = false"
                class="text-gray-400 hover:text-white">&times;</button>
      </div>

      <div class="mb-4">
        <label class="block text-sm text-gray-400 mb-1">Switch to</label>
        <select x-model="driverSelection"
                @change="switchDriver(driverSelection)"
                class="w-full bg-gray-800 border border-gray-700 text-gray-100 rounded px-3 py-2">
          <option value="">-- No driver --</option>
          <template x-for="name in driverRoster" :key="name">
            <option :value="name" x-text="name"></option>
          </template>
        </select>
      </div>

      <table class="w-full text-sm">
        <thead>
          <tr class="text-gray-400 border-b border-gray-700">
            <th class="text-left py-1">Driver</th>
            <th class="text-right py-1">Time</th>
            <th class="text-right py-1">%</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="row in driverStats" :key="row.driver_name">
            <tr class="border-b border-gray-800">
              <td class="py-1 text-gray-100" x-text="row.driver_name"></td>
              <td class="py-1 text-right text-gray-300"
                  x-text="formatDuration(row.total_seconds)"></td>
              <td class="py-1 text-right text-gray-300"
                  x-text="row.pct + '%'"></td>
            </tr>
          </template>
          <tr x-show="driverStats.length === 0">
            <td colspan="3" class="py-2 text-center text-gray-500">No stints recorded yet</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="/static/vendor/leaflet.js"></script>
  <script>
    // Scale to fill the screen using the viewport meta tag rather than CSS transform.
    // This is the correct approach for touchscreen kiosks -- the browser maps touch
    // coordinates through its native viewport scaling, which software rendering handles
    // correctly. CSS transform hit-testing breaks under --disable-gpu.
    (function () {
      // Read logical screen dimensions BEFORE changing viewport.
      // screen.width is unreliable on rotated DSI displays -- use innerWidth/innerHeight.
      var scale = Math.min(window.innerWidth / 800, window.innerHeight / 480);
      document.querySelector('meta[name="viewport"]').content =
        'width=800, initial-scale=' + scale +
        ', minimum-scale=' + scale +
        ', maximum-scale=' + scale +
        ', user-scalable=no';
    })();
  </script>
  <script src="/static/vendor/alpine.min.js" defer></script>
  <script>
    function dashboard() {
      return {
        speed: 0, imuTemp: '—', socTemp: '—',
        gpsBadge: 'NO FIX', gpsBadgeClass: 'bg-red-700',
        syncBadge: 'SYNC OFFLINE', syncBadgeClass: 'bg-red-700',
        events: [],
        gx: 0, gy: 0, peakG: 1.0, peakGAt: 0,
        map: null, marker: null, breadcrumb: null, lastInteract: 0,
        activeDriver: null,
        showDriverModal: false,
        driverStats: [],
        driverRoster: [],
        driverSelection: '',
        showNoteModal: false,
        showFuelModal: false,
        noteBody: '',
        noteEventId: '',
        fuelVolume: '',
        fuelCost: '',
        fuelOdo: '',
        gpsStaleMinutes: 0,
        gpsHasFix: true,
        savingNote: false,
        savingFuel: false,
        errorMsg: '',
        successMsg: '',
        // Kiosk additions
        showMap: false,
        showTimelapse: false,
        timelapseUrl: null,
        alertOverlay: null,
        _alertTimer: null,
        now: Date.now(),
        waypointText: '-- km to --',
        bearingText: '--',
        _waypoints: [
          { name: "Port Douglas",        lat: -16.4838, lng: 145.4673 },
          { name: "The Oasis Roadhouse", lat: -18.8797, lng: 144.5436 },
          { name: "Aramac",              lat: -22.9667, lng: 145.2333 },
          { name: "Toompine",            lat: -27.8500, lng: 144.4833 },
          { name: "Louth",               lat: -30.5333, lng: 145.1167 },
          { name: "Narrandera",          lat: -34.7475, lng: 146.5533 },
          { name: "Dargo",               lat: -37.4975, lng: 147.2692 },
          { name: "Melbourne",           lat: -37.8679, lng: 144.9743 },
        ],
        EVENT_COLOURS: {
          HIGH_G: '#da3633', HARD_BRAKE: '#f85149', BIG_CORNER: '#d29922',
          ROUGH_ROAD: '#8957e5', MANUAL: '#238636', BUTTON: '#238636',
          BOOT: '#1f6feb',
        },
        init() {
          this.initMap();
          this.openFast();
          this.openSlow();
          this.openEvents();
          requestAnimationFrame(() => this.drawGauge());
          // Tick now every second so relativeTime() stays accurate (RESEARCH Pitfall 5)
          setInterval(() => { this.now = Date.now(); }, 1000);
          // Poll for latest timelapse thumbnail every 30s (matches capture interval)
          this.fetchTimelapse();
          setInterval(() => this.fetchTimelapse(), 30000);
        },
        initMap() {
          this.map = L.map('map', { zoomControl: true, attributionControl: false }).setView([-25, 135], 5);
          L.tileLayer('/tiles/{z}/{x}/{y}.png', { minZoom: 5, maxZoom: 15, errorTileUrl: '' }).addTo(this.map);
          this.breadcrumb = L.polyline([], { color: '#1f6feb', weight: 3 }).addTo(this.map);
          this.map.on('dragstart zoomstart', () => { this.lastInteract = Date.now(); });
          // Auto-recentre after 10s of no interaction (D-20)
          setInterval(() => {
            if (this.marker && Date.now() - this.lastInteract > 10000) {
              this.map.panTo(this.marker.getLatLng());
            }
          }, 1000);
        },
        async fetchTimelapse() {
          try {
            const r = await fetch('/api/timelapse/latest');
            if (r.ok) {
              const d = await r.json();
              if (d.url) this.timelapseUrl = d.url + '?t=' + Date.now();
            }
          } catch { /* dashboard may be running without captures mounted */ }
        },
        openTimelapse() { this.showTimelapse = true; },
        closeTimelapse() { this.showTimelapse = false; },
        openMap() {
          this.showMap = true;
          this.$nextTick(() => {
            if (this.map) this.map.invalidateSize();
          });
        },
        closeMap() { this.showMap = false; },
        showAlert(payload) {
          if (this._alertTimer) { clearTimeout(this._alertTimer); this._alertTimer = null; }
          const isSystem = payload.type === 'ALERT';
          const colour = isSystem
            ? '#da3633'
            : (this.EVENT_COLOURS[payload.type] || '#8b949e');
          const message = isSystem
            ? payload.message
            : `${payload.type} · ${(payload.peak_g || 0).toFixed(1)}g`;
          this.alertOverlay = { message, colour, isSystem };
          const duration = isSystem ? 10000 : 3000;
          this._alertTimer = setTimeout(() => { this.alertOverlay = null; }, duration);
        },
        openFast() {
          const es = new EventSource('/sse/fast');
          es.addEventListener('fast', (e) => {
            const d = JSON.parse(e.data);
            this.speed = Math.round(d.speed || 0);
            this.gx = d.gx; this.gy = d.gy;
            const mag = Math.hypot(d.gx, d.gy);
            if (mag > this.peakG) { this.peakG = mag; this.peakGAt = Date.now(); }
            // Decay the auto-range over ~45s back toward 1.0g (D-14)
            const age = (Date.now() - this.peakGAt) / 1000;
            if (age > 5) this.peakG = Math.max(1.0, this.peakG * 0.995);
          });
        },
        openSlow() {
          const es = new EventSource('/sse/slow');
          es.addEventListener('slow', (e) => {
            const d = JSON.parse(e.data);
            this.imuTemp = d.imu_temp != null ? Math.round(d.imu_temp) : '—';
            this.socTemp = d.soc_temp != null ? Math.round(d.soc_temp) : '—';
            if (d.fix_mode === 0) {
              this.gpsBadge = 'NO FIX'; this.gpsBadgeClass = 'bg-red-700';
            } else if (d.fix_mode === 2) {
              this.gpsBadge = `2D · ${d.sats} sats`; this.gpsBadgeClass = 'bg-yellow-600';
            } else {
              this.gpsBadge = `3D · ${d.sats} sats · HDOP ${(d.hdop||0).toFixed(1)}`;
              this.gpsBadgeClass = 'bg-green-700';
            }
            if (d.sync_connected) {
              this.syncBadge = d.sync_backlog > 0 ? `SYNC ${d.sync_backlog} pending` : 'SYNC OK';
              this.syncBadgeClass = d.sync_backlog > 0 ? 'bg-yellow-600' : 'bg-green-700';
            } else {
              this.syncBadge = 'SYNC OFFLINE'; this.syncBadgeClass = 'bg-red-700';
            }
            this.activeDriver = d.active_driver;
            if (d.lat != null && d.lng != null) {
              const ll = [d.lat, d.lng];
              if (!this.marker) {
                this.marker = L.circleMarker(ll, { radius: 6, color: '#1f6feb', fillColor: '#1f6feb', fillOpacity: 1 }).addTo(this.map);
                this.map.setView(ll, 13);
              } else {
                this.marker.setLatLng(ll);
              }
              const pts = this.breadcrumb.getLatLngs();
              pts.push(ll);
              if (pts.length > 300) pts.shift();
              this.breadcrumb.setLatLngs(pts);
              this._updateWaypoint(d.lat, d.lng);
            }
          });
        },
        openEvents() {
          const es = new EventSource('/sse/events');
          es.addEventListener('event', (e) => {
            const ev = JSON.parse(e.data);
            // ALERT events go to the overlay only — they are not rally events
            if (ev.type === 'ALERT') {
              this.showAlert(ev);
              return;
            }
            this.events.unshift(ev);
            if (this.events.length > 5) this.events.pop();
            this.showAlert(ev);
            if (ev.lat != null && ev.lng != null) {
              const col = this.EVENT_COLOURS[ev.type] || '#8b949e';
              const label = ev.peak_g ? `${ev.type} · ${ev.peak_g.toFixed(1)}g` : ev.type;
              L.circleMarker([ev.lat, ev.lng], { radius: 6, color: col, fillColor: col, fillOpacity: 0.85 })
                .bindPopup(label)
                .addTo(this.map);
            }
          });
        },
        _haversineKm(lat1, lon1, lat2, lon2) {
          const R = 6371;
          const dLat = (lat2 - lat1) * Math.PI / 180;
          const dLon = (lon2 - lon1) * Math.PI / 180;
          const a = Math.sin(dLat/2)**2 +
                    Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
          return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        },
        _bearingDeg(lat1, lon1, lat2, lon2) {
          const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
          const Δλ = (lon2 - lon1) * Math.PI / 180;
          const y = Math.sin(Δλ) * Math.cos(φ2);
          const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
          return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
        },
        _cardinalPoint(deg) {
          const pts = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
          return pts[Math.round(deg / 22.5) % 16];
        },
        _updateWaypoint(lat, lng) {
          if (lat == null || lng == null) return;
          let best = null, bestDist = Infinity;
          for (const wp of this._waypoints) {
            const d = this._haversineKm(lat, lng, wp.lat, wp.lng);
            if (d < bestDist) { bestDist = d; best = wp; }
          }
          if (best) {
            this.waypointText = `${Math.round(bestDist)} km to ${best.name}`;
            const deg = this._bearingDeg(lat, lng, best.lat, best.lng);
            this.bearingText = `${this._cardinalPoint(deg)} · ${Math.round(deg)}°`;
          }
        },
        relativeTime(ts) {
          void this.now; // reference now so Alpine re-renders this when now ticks
          const diff = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
          if (diff < 0) return 'just now';
          if (diff < 60) return `${diff}s ago`;
          const m = Math.floor(diff / 60);
          return m < 60 ? `${m}m ago` : `${Math.floor(m/60)}h ${m%60}m ago`;
        },
        drawGauge() {
          const c = document.getElementById('ggauge');
          if (!c) return;
          const ctx = c.getContext('2d');
          const w = c.width, h = c.height, cx = w/2, cy = h/2, r = Math.min(w,h)/2 - 10;
          ctx.clearRect(0,0,w,h);
          ctx.strokeStyle = '#21262d'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx-r,cy); ctx.lineTo(cx+r,cy); ctx.moveTo(cx,cy-r); ctx.lineTo(cx,cy+r); ctx.stroke();
          // dot position scaled by auto-range peak
          const px = cx + (this.gx / this.peakG) * r;
          const py = cy - (this.gy / this.peakG) * r;
          ctx.fillStyle = '#1f6feb';
          ctx.beginPath(); ctx.arc(px, py, 8, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#8b949e'; ctx.font = '14px system-ui';
          ctx.fillText(`±${this.peakG.toFixed(1)}g`, 10, 20);
          requestAnimationFrame(() => this.drawGauge());
        },
        async fetchGpsStatus() {
          try {
            const r = await fetch('/api/logbook/gps');
            const data = await r.json();
            this.gpsHasFix = data.has_fix;
            this.gpsStaleMinutes = data.stale_seconds != null
              ? Math.max(1, Math.round(data.stale_seconds / 60)) : 0;
          } catch { this.gpsHasFix = false; this.gpsStaleMinutes = 0; }
        },
        async openNoteModal() {
          this.errorMsg = '';
          this.noteBody = '';
          this.noteEventId = '';
          await this.fetchGpsStatus();
          this.showNoteModal = true;
        },
        async openFuelModal() {
          this.errorMsg = '';
          this.fuelVolume = '';
          this.fuelCost = '';
          this.fuelOdo = '';
          await this.fetchGpsStatus();
          this.showFuelModal = true;
        },
        async saveNote() {
          if (!this.noteBody.trim()) return;
          this.savingNote = true;
          this.errorMsg = '';
          try {
            const body = { body: this.noteBody };
            if (this.noteEventId) body.event_id = parseInt(this.noteEventId, 10);
            const r = await fetch('/api/notes', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify(body)
            });
            if (!r.ok) throw new Error('save failed');
            this.showNoteModal = false;
            this.flashSuccess('Note saved');
          } catch {
            this.errorMsg = 'Could not save — try again';
          } finally { this.savingNote = false; }
        },
        async saveFuel() {
          const vol = parseFloat(this.fuelVolume);
          if (!(vol > 0)) return;
          this.savingFuel = true;
          this.errorMsg = '';
          try {
            const body = { volume_litres: vol };
            if (this.fuelCost) body.cost_aud = parseFloat(this.fuelCost);
            if (this.fuelOdo) body.odometer_km = parseFloat(this.fuelOdo);
            const r = await fetch('/api/fuel', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify(body)
            });
            if (!r.ok) throw new Error('save failed');
            this.showFuelModal = false;
            this.flashSuccess('Fuel stop logged');
          } catch {
            this.errorMsg = 'Could not save — try again';
          } finally { this.savingFuel = false; }
        },
        async openDriverModal() {
          try {
            const r = await fetch('/api/driver/stats');
            if (r.ok) {
              const data = await r.json();
              this.driverStats = data.drivers || [];
              this.driverRoster = data.roster || [];
              this.driverSelection = data.active_driver || '';
            }
          } catch (e) { console.error('driver stats fetch failed', e); }
          this.showDriverModal = true;
        },
        async switchDriver(name) {
          try {
            const r = await fetch('/api/driver', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({name: name}),
            });
            if (r.ok) {
              const data = await r.json();
              this.activeDriver = data.driver_name;
              // Refresh stats so the modal reflects the new stint
              const s = await fetch('/api/driver/stats');
              if (s.ok) {
                const sd = await s.json();
                this.driverStats = sd.drivers || [];
              }
            } else {
              console.warn('driver switch rejected', r.status);
            }
          } catch (e) { console.error('driver switch failed', e); }
        },
        formatDuration(seconds) {
          if (!seconds || seconds <= 0) return '0m';
          const h = Math.floor(seconds / 3600);
          const m = Math.floor((seconds % 3600) / 60);
          return h > 0 ? `${h}h ${m}m` : `${m}m`;
        },
        flashSuccess(msg) {
          this.successMsg = msg;
          setTimeout(() => { this.successMsg = ''; }, 3000);
        },
      };
    }
  </script>
</body>
</html>
