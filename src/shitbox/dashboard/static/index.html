<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>shitbox</title>
  <link rel="stylesheet" href="/static/vendor/tailwind.min.css">
  <link rel="stylesheet" href="/static/vendor/leaflet.css">
  <style>
    html, body { margin: 0; padding: 0; width: 1024px; height: 600px; overflow: hidden; background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    * { cursor: none !important; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    .num { font-variant-numeric: tabular-nums; font-weight: 600; }
    .card { background: #161b22; border: 1px solid #21262d; }
    .badge { padding: 2px 8px; border-radius: 4px; font-size: 15px; font-weight: 600; display: inline-block; }
    .ev-HIGH_G { background: #da3633; color: #fff; }
    .ev-HARD_BRAKE { background: #f85149; color: #fff; }
    .ev-BIG_CORNER { background: #d29922; color: #000; }
    .ev-ROUGH_ROAD { background: #8957e5; color: #fff; }
    .ev-MANUAL, .ev-BUTTON { background: #238636; color: #fff; }
    .ev-BOOT { background: #1f6feb; color: #fff; }
    #map { background: #0d1117; width: 100%; height: 100%; }
    .stale { color: #da3633; }
    .bg-red-700 { background: #b91c1c; color: #fff; }
    .bg-yellow-600 { background: #ca8a04; color: #000; }
    .bg-green-700 { background: #15803d; color: #fff; }
    .bg-gray-700 { background: #374151; color: #9ca3af; }
    .hw-banner { background: #da3633; color: #fff; font-weight: 600; padding: 8px 12px; border-radius: 4px; margin-bottom: 8px; }
    .hw-row { display: grid; grid-template-columns: 24px 1fr auto auto 48px; gap: 12px; align-items: center; padding: 4px 0; }
    .hw-row-lg { grid-template-columns: 36px 1fr auto auto 72px; gap: 20px; padding: 10px 0; border-bottom: 1px solid #21262d; }
    .hw-row-lg .hw-glyph { font-size: 28px; }
    .hw-row-lg .hw-label { font-size: 26px; }
    .hw-row-lg .hw-state { font-size: 22px; }
    .hw-row-lg .hw-since { font-size: 18px; }
    .hw-glyph { font-size: 18px; }
    .hw-label { font-size: 18px; font-weight: 600; color: #e6edf3; }
    .hw-state { font-size: 18px; font-weight: 400; }
    .hw-since { font-size: 13px; color: #8b949e; text-align: right; }
    .hw-missing .hw-glyph { color: #8b949e; }
    .hw-missing .hw-state { color: #da3633; }
    .hw-degraded .hw-glyph { color: #d29922; }
    .hw-degraded .hw-state { color: #f85149; }
    .hw-present .hw-glyph { color: #238636; }
    /* System condition row states — mirror .hw-* pattern (Phase 15 D-13) */
    .sc-clear .hw-glyph { color: #8b949e; }
    .sc-clear .hw-state { color: #8b949e; }
    .sc-active .hw-glyph { color: #da3633; }
    .sc-active .hw-state { color: #f85149; }
    .sc-recovering .hw-glyph { color: #d29922; }
    .sc-recovering .hw-state { color: #d29922; }
    .sc-restored .hw-glyph { color: #238636; }
    .sc-restored .hw-state { color: #238636; }
    .hw-section-eyebrow {
      color: #8b949e;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 0 4px 0;
    }
    .badge-critical { background: #da3633; color: #fff; }
    .badge-important { background: #d29922; color: #000; }
    .badge-best_effort { background: #8b949e; color: #fff; }
    .hw-empty { color: #d29922; font-size: 15px; }
    .hw-rollup { color: #8b949e; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body x-data="dashboard()" x-init="init()" style="display: flex; flex-direction: column; width: 1024px; height: 600px; overflow: hidden;">

  <!-- TOP STRIP (h: 100px) — three equal columns -->
  <header class="card" style="height: 100px; flex-shrink: 0; display: flex; padding: 0 24px; gap: 16px;">

    <!-- Col 1: Speed + driver (33%) -->
    <div style="flex: 1; display: flex; align-items: center; gap: 12px; overflow: hidden;">
      <div class="num" style="font-size: 90px; line-height: 1; width: 180px; flex-shrink: 0; text-align: right;">
        <span x-text="speed"></span>
      </div>
      <div style="display: flex; flex-direction: column; justify-content: center; gap: 2px;">
        <div class="text-gray-400" style="font-size: 18px;">km/h</div>
        <div class="text-gray-400" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px;">Driver</div>
        <div class="cursor-pointer text-gray-100 hover:text-white font-semibold"
             style="font-size: 20px;"
             @click="openDriverModal()"
             x-text="activeDriver || '---'"></div>
      </div>
    </div>

    <!-- Col 2: Status badges 2×2 grid (33%) -->
    <div style="flex: 1; display: flex; align-items: center; justify-content: center;">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <span class="badge" :class="gpsBadgeClass" x-text="gpsBadge"></span>
        <span class="badge" :class="netBadgeClass" x-text="netBadge"></span>
        <span class="badge" :class="syncBadgeClass" x-text="syncBadge"></span>
        <span class="badge" :class="recBadgeClass" x-text="recBadge"></span>
      </div>
    </div>

    <!-- Col 3: Action buttons (33%) -->
    <div style="flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
      <button @click="openMap()"
              style="cursor: pointer; background: #161b22; border: 1px solid #30363d;
                     color: #58a6ff; font-size: 28px; font-weight: 700;
                     padding: 8px 14px; border-radius: 4px; min-height: 52px;">Map</button>
      <button @click="openNoteModal()"
              style="cursor: pointer; background: #161b22; border: 1px solid #30363d;
                     color: #e6edf3; font-size: 28px; font-weight: 700;
                     padding: 8px 14px; border-radius: 4px; min-height: 52px;">Note</button>
      <button @click="openFuelModal()"
              style="cursor: pointer; background: #161b22; border: 1px solid #30363d;
                     color: #e6edf3; font-size: 28px; font-weight: 700;
                     padding: 8px 14px; border-radius: 4px; min-height: 52px;">Fuel</button>
      <button @click="openHardwareModal()"
              :class="hwBadgeClass()"
              :title="hwStatusTitle()"
              style="cursor: pointer; border: 1px solid #30363d;
                     font-size: 28px; font-weight: 700;
                     padding: 8px 14px; border-radius: 4px; min-height: 52px;">Health</button>
      <span class="badge" x-show="successMsg" x-text="successMsg"
            style="background: #238636; color: #fff;"></span>
    </div>
  </header>

  <!-- MAIN CENTRE (fills remaining height between header and footer) -->
  <main style="flex: 1; display: flex; overflow: hidden;">

    <!-- Left: G-gauge -->
    <div class="card" style="width: 340px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 4px;">
      <canvas id="ggauge" width="320" height="320"></canvas>
    </div>

    <!-- Right: data tiles + MAP button -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 8px; overflow: hidden;">

      <!-- Temp row -->
      <div style="display: flex; gap: 6px; flex: 1;">
        <div class="card" style="flex: 1; padding: 8px; display: flex; flex-direction: column; justify-content: center;">
          <div class="text-gray-400" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;">Cabin Temp</div>
          <div class="num" style="font-size: 36px;"><span x-text="imuTemp"></span> <span class="text-gray-400" style="font-size: 20px;">&deg;C</span></div>
        </div>
        <div class="card" style="flex: 1; padding: 8px; display: flex; flex-direction: column; justify-content: center;">
          <div class="text-gray-400" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;">SoC Temp</div>
          <div class="num" style="font-size: 36px;"><span x-text="socTemp"></span> <span class="text-gray-400" style="font-size: 20px;">&deg;C</span></div>
        </div>
      </div>

      <!-- Waypoint distance + Bearing row -->
      <div style="display: flex; gap: 6px; flex: 1;">
        <div class="card" style="flex: 1; padding: 8px; display: flex; flex-direction: column; justify-content: center;">
          <div class="text-gray-400" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;">Next WP</div>
          <div class="num" style="font-size: 26px;" x-text="waypointText"></div>
        </div>
        <div class="card" style="flex: 1; padding: 8px; display: flex; flex-direction: column; justify-content: center;">
          <div class="text-gray-400" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;">To WP</div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <svg width="44" height="44" viewBox="0 0 48 48"
                 :style="`transform: rotate(${bearingArrowDeg}deg); transition: transform 0.2s linear;`">
              <path d="M24 4 L36 38 L24 30 L12 38 Z" fill="#58a6ff"/>
            </svg>
            <div class="num" style="font-size: 24px;" x-text="bearingText"></div>
          </div>
        </div>
      </div>

      <!-- Current G + Time row -->
      <div style="display: flex; gap: 6px; flex: 1;">
        <div class="card" style="flex: 1; padding: 8px; display: flex; flex-direction: column; justify-content: center;">
          <div class="text-gray-400" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;">Current G</div>
          <div class="num" style="font-size: 36px;" x-text="(Math.hypot(gx, gy)).toFixed(2) + 'g'"></div>
        </div>
        <div class="card" style="flex: 1; padding: 8px; display: flex; flex-direction: column; justify-content: center;">
          <div class="text-gray-400" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;">Time</div>
          <div class="num" style="font-size: 36px;" x-text="new Date(now).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12: false})"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- BOTTOM STRIP: 5-item event ticker + timelapse thumbnail (h: 130px) -->
  <footer class="card" style="height: 130px; flex-shrink: 0; padding: 6px 10px; overflow: hidden; display: flex; gap: 8px;">
    <!-- Event ticker -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden;">
      <template x-for="ev in events" :key="ev.ts || ev.timestamp">
        <div style="display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden;">
          <span class="badge" :class="'ev-' + ev.type"
                :style="`background:${EVENT_COLOURS[ev.type] || '#8b949e'}`"
                x-text="ev.type"></span>
          <span class="num text-gray-300" style="font-size: 18px;"
                x-text="(ev.peak_g || 0).toFixed(1) + 'g'"></span>
          <span class="text-gray-400" style="font-size: 15px;"
                x-text="relativeTime(ev.ts || ev.timestamp)"></span>
        </div>
      </template>
      <div x-show="events.length === 0" class="text-gray-400" style="font-size: 18px;">No events yet</div>
    </div>
    <!-- Timelapse thumbnail -->
    <div x-show="timelapseUrl" style="flex-shrink: 0; width: 90px; height: 90px; cursor: pointer;"
         @click="openTimelapse()">
      <img :src="timelapseUrl" alt="timelapse"
           style="width: 90px; height: 90px; object-fit: cover; border-radius: 4px; border: 1px solid #21262d;">
    </div>
  </footer>

  <!-- Timelapse fullscreen overlay (z-index 100, same level as map) -->
  <div x-show="showTimelapse"
       x-cloak
       @keydown.escape.window="showTimelapse && closeTimelapse()"
       style="position: fixed; inset: 0; z-index: 100; background: #0d1117; display: flex; align-items: center; justify-content: center;"
       @click="closeTimelapse()">
    <button @click="closeTimelapse()"
            style="position: absolute; top: 12px; right: 16px; z-index: 110;
                   background: #161b22; border: 1px solid #21262d; color: #e6edf3;
                   padding: 6px 14px; border-radius: 4px; font-size: 35px;
                   cursor: pointer; font-weight: 700;">&times; Close</button>
    <img :src="timelapseUrl" alt="timelapse"
         style="max-width: 100%; max-height: 100%; object-fit: contain;">
  </div>

  <!-- MAP overlay (z-index 100, reuses existing #map div + Leaflet instance) -->
  <div x-show="showMap"
       x-cloak
       @keydown.escape.window="showMap && closeMap()"
       style="position: fixed; inset: 0; z-index: 100; background: #0d1117;"
       @click.self="closeMap()">
    <div id="map" style="position: absolute; inset: 0;"></div>
    <!-- Close button top-right so tap-to-dismiss on dark edges still works -->
    <!-- Rendered AFTER #map and z-index above Leaflet panes (which go up to ~1000) -->
    <button @click="closeMap()"
            style="position: absolute; top: 12px; right: 16px; z-index: 1100;
                   background: #161b22; border: 1px solid #21262d; color: #e6edf3;
                   padding: 6px 14px; border-radius: 4px; font-size: 35px;
                   cursor: pointer; font-weight: 700;">&times; Close</button>
  </div>

  <!-- Alert overlay (z-index 150, above map overlay, below modals) -->
  <div x-show="alertOverlay"
       x-cloak
       style="position: fixed; inset: 0; z-index: 150; display: flex; align-items: center; justify-content: center; pointer-events: none;"
       :style="alertOverlay ? `background:${alertOverlay.colour}CC` : ''">
    <div class="text-white font-bold"
         style="font-size: 101px; text-align: center; padding: 24px; text-shadow: 0 2px 8px rgba(0,0,0,0.6);"
         x-text="alertOverlay ? alertOverlay.message : ''"></div>
  </div>

  <!-- Field Note modal (full screen) — x-if recreates element fresh, avoiding Alpine display-toggle -->
  <template x-if="showNoteModal">
  <div @keydown.escape.window="showNoteModal = false"
       style="position: fixed; inset: 0; background: #0d1117; z-index: 1000;
              display: grid; grid-template-rows: auto auto 1fr auto; padding: 48px; gap: 24px;
              box-sizing: border-box;">

    <!-- Title row -->
    <h2 style="font-size: 39px; font-weight: 600; margin: 0; color: #e6edf3;">Field Note</h2>

    <!-- Event pin -->
    <select x-model="noteEventId" :disabled="events.length === 0"
            style="background: #161b22; border: 1px solid #21262d; color: #e6edf3;
                   border-radius: 8px; padding: 12px 16px; font-size: 26px; min-height: 60px;">
      <option value="" x-text="events.length === 0 ? 'No recent events' : 'No event pin'"></option>
      <template x-for="ev in events.slice(0, 10)" :key="ev.id">
        <option :value="ev.id" x-text="(ev.type || 'EVENT') + ' @ ' + ev.timestamp"></option>
      </template>
    </select>

    <!-- Textarea fills the 1fr row -->
    <textarea x-model="noteBody" placeholder="What happened?"
              style="width: 100%; height: 100%; background: #161b22; border: 1px solid #21262d;
                     color: #e6edf3; border-radius: 8px; padding: 24px; box-sizing: border-box;
                     font-size: 31px; font-family: inherit; resize: none;"></textarea>

    <!-- Bottom row: GPS status + buttons -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px;">
      <div style="font-size: 26px; font-weight: 600;">
        <span x-show="gpsHasFix" style="color: #8b949e;">Location captured (3D fix)</span>
        <span x-show="!gpsHasFix && gpsStaleMinutes > 0" style="color: #ca8a04;"
              x-text="'Location from ' + gpsStaleMinutes + ' minutes ago'"></span>
        <span x-show="!gpsHasFix && gpsStaleMinutes === 0" style="color: #ca8a04;">No GPS fix available</span>
        <span x-show="errorMsg" x-text="errorMsg" style="color: #da3633; margin-left: 16px;"></span>
      </div>
      <div style="display: flex; gap: 16px;">
        <button @click="showNoteModal = false"
                style="background: #161b22; color: #8b949e; padding: 16px 32px; font-size: 35px;
                       border: 1px solid #21262d; border-radius: 8px; cursor: pointer;">Close</button>
        <button @click.prevent="saveNote()" :disabled="savingNote || !noteBody.trim()"
                :style="(savingNote || !noteBody.trim())
                  ? 'background: #21262d; color: #8b949e; cursor: not-allowed; padding: 16px 32px; font-size: 35px; border: none; border-radius: 8px;'
                  : 'background: #1f6feb; color: #fff; cursor: pointer; padding: 16px 32px; font-size: 35px; border: none; border-radius: 8px; font-weight: 600;'"
                x-text="savingNote ? 'Saving...' : 'Save Note'"></button>
      </div>
    </div>
  </div>
  </template>

  <!-- Fuel Stop modal (full screen) -->
  <div x-show="showFuelModal" x-cloak
       @keydown.escape.window="showFuelModal = false"
       style="position: fixed; inset: 0; background: #0d1117; z-index: 1000;
              display: flex; flex-direction: column; padding: 48px; gap: 32px;">

    <h2 style="font-size: 39px; font-weight: 600; margin: 0; color: #e6edf3; flex-shrink: 0;">Fuel Stop</h2>

    <!-- Litres + Cost side by side -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; flex-shrink: 0;">
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <label style="font-size: 23px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.05em;">Litres</label>
        <input type="number" step="0.1" min="0" x-model="fuelVolume" placeholder="0.0"
               style="background: #161b22; border: 1px solid #21262d; color: #e6edf3;
                      border-radius: 8px; padding: 20px; font-size: 39px; min-height: 90px;" />
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <label style="font-size: 23px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.05em;">Cost (AUD)</label>
        <input type="number" step="0.01" min="0" x-model="fuelCost" placeholder="0.00"
               style="background: #161b22; border: 1px solid #21262d; color: #e6edf3;
                      border-radius: 8px; padding: 20px; font-size: 39px; min-height: 90px;" />
      </div>
    </div>

    <!-- Odometer full width -->
    <div style="display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;">
      <label style="font-size: 23px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.05em;">Odometer (km) — optional</label>
      <input type="number" step="1" min="0" x-model="fuelOdo" placeholder="0"
             style="background: #161b22; border: 1px solid #21262d; color: #e6edf3;
                    border-radius: 8px; padding: 20px; font-size: 39px; min-height: 90px;" />
    </div>

    <!-- GPS status + error + buttons -->
    <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
      <div style="font-size: 26px; font-weight: 600;">
        <span x-show="gpsHasFix" style="color: #8b949e;">Location captured (3D fix)</span>
        <span x-show="!gpsHasFix && gpsStaleMinutes > 0" style="color: #ca8a04;"
              x-text="'Location from ' + gpsStaleMinutes + ' minutes ago'"></span>
        <span x-show="!gpsHasFix && gpsStaleMinutes === 0" style="color: #ca8a04;">No GPS fix available</span>
        <span x-show="errorMsg" x-text="errorMsg" style="color: #da3633; margin-left: 16px;"></span>
      </div>
      <div style="display: flex; gap: 16px;">
        <button @click="showFuelModal = false"
                style="background: #161b22; color: #8b949e; padding: 16px 32px; font-size: 35px;
                       border: 1px solid #21262d; border-radius: 8px; cursor: pointer;">Close</button>
        <button @click.prevent="saveFuel()" :disabled="savingFuel || !(parseFloat(fuelVolume) > 0)"
                :style="(savingFuel || !(parseFloat(fuelVolume) > 0))
                  ? 'background: #21262d; color: #8b949e; cursor: not-allowed; padding: 16px 32px; font-size: 35px; border: none; border-radius: 8px;'
                  : 'background: #1f6feb; color: #fff; cursor: pointer; padding: 16px 32px; font-size: 35px; border: none; border-radius: 8px; font-weight: 600;'"
                x-text="savingFuel ? 'Saving...' : 'Save Fuel Stop'"></button>
      </div>
    </div>
  </div>

  <!-- Driver stats modal (full screen) -->
  <div x-show="showDriverModal"
       x-cloak
       @keydown.escape.window="showDriverModal = false"
       style="position: fixed; inset: 0; background: #0d1117; z-index: 1000;
              display: flex; flex-direction: column; padding: 48px; gap: 24px;">

    <h2 style="font-size: 39px; font-weight: 600; margin: 0; color: #e6edf3;">Driver</h2>

    <select x-model="driverSelection"
            @change="switchDriver(driverSelection)"
            style="background: #161b22; border: 1px solid #21262d;
                   color: #e6edf3; border-radius: 8px; padding: 16px;
                   font-size: 31px; min-height: 70px;">
      <option value="">-- No driver --</option>
      <template x-for="name in driverRoster" :key="name">
        <option :value="name" x-text="name"></option>
      </template>
    </select>

    <table style="width: 100%; border-collapse: collapse; font-size: 31px;">
      <thead>
        <tr style="color: #8b949e; border-bottom: 1px solid #21262d;">
          <th style="text-align: left; padding: 12px 0;">Driver</th>
          <th style="text-align: right; padding: 12px 0;">Time</th>
          <th style="text-align: right; padding: 12px 0;">%</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="row in driverStats" :key="row.driver_name">
          <tr style="border-bottom: 1px solid #161b22;">
            <td style="padding: 14px 0; color: #e6edf3;" x-text="row.driver_name"></td>
            <td style="padding: 14px 0; text-align: right; color: #8b949e;"
                x-text="formatDuration(row.total_seconds)"></td>
            <td style="padding: 14px 0; text-align: right; color: #8b949e;"
                x-text="row.pct + '%'"></td>
          </tr>
        </template>
        <tr x-show="driverStats.length === 0">
          <td colspan="3" style="padding: 16px 0; text-align: center; color: #8b949e;">No stints recorded yet</td>
        </tr>
      </tbody>
    </table>

    <div style="margin-top: auto; display: flex; justify-content: flex-end;">
      <button @click="showDriverModal = false"
              style="background: #1f6feb; color: #fff; padding: 16px 32px; font-size: 35px;
                     border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Done</button>
    </div>
  </div>

  <!-- Hardware status modal (full screen) -->
  <div x-show="showHardwareModal" x-cloak
       @keydown.escape.window="showHardwareModal = false"
       style="position: fixed; inset: 0; background: #0d1117; z-index: 1000; box-sizing: border-box;">

    <!-- Title pinned top-left -->
    <h2 style="position: absolute; top: 24px; left: 48px; font-size: 39px; font-weight: 600; margin: 0; color: #e6edf3;">Health</h2>

    <!-- Critical banner pinned below title -->
    <div x-show="criticalMissing()" class="hw-banner"
         style="position: absolute; top: 80px; left: 48px; right: 48px; font-size: 26px;"
         x-text="'CRITICAL: ' + criticalMissing() + ' OFFLINE'"></div>

    <!-- Scrollable list: absolutely positioned between header band and footer band -->
    <div style="position: absolute; top: 140px; bottom: 110px; left: 48px; right: 48px;
                overflow-y: auto; padding-right: 8px; -webkit-overflow-scrolling: touch;">
      <!-- SYSTEM conditions — above HARDWARE list (UI-SPEC lines 126-148) -->
      <div class="hw-section-eyebrow">SYSTEM</div>
      <template x-for="row in systemConditions" :key="row.role">
        <div class="hw-row hw-row-lg" :class="'sc-' + row.state + ' hw-tier-critical'">
          <span class="hw-glyph" x-text="scGlyph(row.state)"></span>
          <span class="hw-label" x-text="row.label"></span>
          <span class="badge" :class="'badge-' + row.tier" x-text="row.tier"></span>
          <span class="hw-state" x-text="scStateText(row.state)"></span>
          <span class="hw-since" x-text="sinceText(row.since_ms)"></span>
        </div>
      </template>

      <div class="hw-section-eyebrow" style="margin-top: 12px;">HARDWARE</div>
      <template x-for="row in sortedHardware()" :key="row.role">
        <div class="hw-row hw-row-lg" :class="'hw-' + row.state + ' hw-tier-' + row.tier">
          <span class="hw-glyph" x-text="stateGlyph(row.state)"></span>
          <span class="hw-label" x-text="row.label"></span>
          <span class="badge" :class="'badge-' + row.tier" x-text="row.tier"></span>
          <span class="hw-state" x-text="stateText(row.state)"></span>
          <span class="hw-since" x-text="sinceText(row.since_ms)"></span>
        </div>
      </template>
      <div x-show="hardware.length === 0" class="hw-empty" style="font-size: 22px; padding: 12px 0;">
        No hardware manifest — check config.yaml
      </div>
    </div>

    <!-- Rollup pinned above footer -->
    <div x-show="hardware.length > 0" class="hw-rollup"
         style="position: absolute; bottom: 72px; left: 48px; right: 48px; font-size: 18px;"
         x-text="`${beRollup().present} best_effort present / ${beRollup().total} declared`"></div>

    <!-- Bottom Close pinned bottom-right -->
    <button @click="showHardwareModal = false"
            style="position: absolute; bottom: 24px; right: 48px;
                   background: #1f6feb; color: #fff; padding: 12px 28px; font-size: 28px;
                   border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Close</button>
  </div>

  <script src="/static/vendor/leaflet.js"></script>
  <script>
    // Set page dimensions to match the actual screen.
    // No transforms, no viewport tricks -- just make the layout the right size.
    // innerWidth/innerHeight are rotation-aware; screen.width/height are not.
    (function () {
      var w = window.innerWidth, h = window.innerHeight;
      document.documentElement.style.width  = w + 'px';
      document.documentElement.style.height = h + 'px';
      document.body.style.width  = w + 'px';
      document.body.style.height = h + 'px';
    })();
  </script>
  <script src="/static/vendor/alpine.min.js" defer></script>
  <script>
    function dashboard() {
      return {
        speed: 0, imuTemp: '—', socTemp: '—',
        hardware: [],
        systemConditions: [],
        gpsBadge: 'NO FIX', gpsBadgeClass: 'bg-red-700',
        syncBadge: 'SYNC OFFLINE', syncBadgeClass: 'bg-red-700',
        netBadge: 'NET OFFLINE', netBadgeClass: 'bg-red-700',
        recBadge: 'NO REC', recBadgeClass: 'bg-gray-700',
        events: [],
        gx: 0, gy: 0, peakG: 1.0, peakGAt: 0,
        map: null, marker: null, breadcrumb: null, lastInteract: 0,
        activeDriver: null,
        showDriverModal: false,
        driverStats: [],
        driverRoster: [],
        driverSelection: '',
        showNoteModal: false,
        showFuelModal: false,
        noteBody: '',
        noteEventId: '',
        fuelVolume: '',
        fuelCost: '',
        fuelOdo: '',
        gpsStaleMinutes: 0,
        gpsHasFix: true,
        savingNote: false,
        savingFuel: false,
        errorMsg: '',
        successMsg: '',
        // Kiosk additions
        showMap: false,
        showTimelapse: false,
        showHardwareModal: false,
        timelapseUrl: null,
        alertOverlay: null,
        _alertTimer: null,
        now: Date.now(),
        waypointText: '-- km to --',
        bearingText: '--',
        bearingArrowDeg: 0,
        heading: null,
        _bearingToWpDeg: null,
        _waypoints: [
          { name: "Port Douglas",        lat: -16.4838, lng: 145.4673 },
          { name: "The Oasis Roadhouse", lat: -18.8797, lng: 144.5436 },
          { name: "Aramac",              lat: -22.9667, lng: 145.2333 },
          { name: "Toompine",            lat: -27.8500, lng: 144.4833 },
          { name: "Louth",               lat: -30.5333, lng: 145.1167 },
          { name: "Narrandera",          lat: -34.7475, lng: 146.5533 },
          { name: "Dargo",               lat: -37.4975, lng: 147.2692 },
          { name: "Melbourne",           lat: -37.8679, lng: 144.9743 },
        ],
        EVENT_COLOURS: {
          HIGH_G: '#da3633', HARD_BRAKE: '#f85149', BIG_CORNER: '#d29922',
          ROUGH_ROAD: '#8957e5', MANUAL: '#238636', BUTTON: '#238636',
          BOOT: '#1f6feb',
        },
        init() {
          this.initMap();
          this.openFast();
          this.openSlow();
          this.openEvents();
          requestAnimationFrame(() => this.drawGauge());
          // Tick now every second so relativeTime() stays accurate (RESEARCH Pitfall 5)
          setInterval(() => { this.now = Date.now(); }, 1000);
          // Poll for latest timelapse thumbnail every 30s (matches capture interval)
          this.fetchTimelapse();
          setInterval(() => this.fetchTimelapse(), 30000);
        },
        initMap() {
          this.map = L.map('map', { zoomControl: true, attributionControl: false }).setView([-25, 135], 5);
          L.tileLayer('/tiles/{z}/{x}/{y}.png', { minZoom: 5, maxZoom: 15, errorTileUrl: '' }).addTo(this.map);
          this.breadcrumb = L.polyline([], { color: '#1f6feb', weight: 3 }).addTo(this.map);
          this.map.on('dragstart zoomstart', () => { this.lastInteract = Date.now(); });
          // Auto-recentre after 10s of no interaction (D-20)
          setInterval(() => {
            if (this.marker && Date.now() - this.lastInteract > 10000) {
              this.map.panTo(this.marker.getLatLng());
            }
          }, 1000);
        },
        async fetchTimelapse() {
          try {
            const r = await fetch('/api/timelapse/latest');
            if (r.ok) {
              const d = await r.json();
              if (d.url) this.timelapseUrl = d.url + '?t=' + Date.now();
            }
          } catch { /* dashboard may be running without captures mounted */ }
        },
        openTimelapse() { this.showTimelapse = true; },
        closeTimelapse() { this.showTimelapse = false; },
        openMap() {
          this.showMap = true;
          this.$nextTick(() => {
            if (this.map) this.map.invalidateSize();
          });
        },
        closeMap() { this.showMap = false; },
        showAlert(payload) {
          if (this._alertTimer) { clearTimeout(this._alertTimer); this._alertTimer = null; }
          const isSystem = payload.type === 'ALERT';
          const subtype = payload.subtype || '';
          const isRecovery = isSystem && (subtype.endsWith('_CLEARED') || subtype.endsWith('_RESTORED'));
          const colour = isRecovery
            ? '#238636'                                   // green — recovery
            : (isSystem
                ? '#da3633'                               // red — failure/active
                : (this.EVENT_COLOURS[payload.type] || '#8b949e'));
          const message = isSystem
            ? payload.message
            : `${payload.type} · ${(payload.peak_g || 0).toFixed(1)}g`;
          this.alertOverlay = { message, colour, isSystem };
          const duration = isRecovery ? 3000 : (isSystem ? 10000 : 3000);
          this._alertTimer = setTimeout(() => { this.alertOverlay = null; }, duration);
        },
        openFast() {
          const es = new EventSource('/sse/fast');
          es.addEventListener('fast', (e) => {
            const d = JSON.parse(e.data);
            this.speed = Math.round(d.speed || 0);
            this.heading = (d.heading != null) ? d.heading : null;
            this._renderBearing();
            this.gx = d.gx; this.gy = d.gy;
            const mag = Math.hypot(d.gx, d.gy);
            if (mag > this.peakG) { this.peakG = mag; this.peakGAt = Date.now(); }
            // Decay the auto-range over ~45s back toward 1.0g (D-14)
            const age = (Date.now() - this.peakGAt) / 1000;
            if (age > 5) this.peakG = Math.max(1.0, this.peakG * 0.995);
          });
        },
        openSlow() {
          const es = new EventSource('/sse/slow');
          es.addEventListener('slow', (e) => {
            const d = JSON.parse(e.data);
            this.imuTemp = d.imu_temp != null ? Math.round(d.imu_temp) : '—';
            this.socTemp = d.soc_temp != null ? Math.round(d.soc_temp) : '—';
            if (d.fix_mode === 0) {
              this.gpsBadge = 'GPS'; this.gpsBadgeClass = 'bg-red-700';
            } else if (d.fix_mode === 2) {
              this.gpsBadge = 'GPS : 2D'; this.gpsBadgeClass = 'bg-yellow-600';
            } else {
              this.gpsBadge = 'GPS : 3D'; this.gpsBadgeClass = 'bg-green-700';
            }
            this.netBadge = d.sync_connected ? 'NET OK' : 'NET OFFLINE';
            this.netBadgeClass = d.sync_connected ? 'bg-green-700' : 'bg-red-700';
            if (d.sync_connected) {
              this.syncBadge = d.sync_backlog > 0 ? `SYNC ${d.sync_backlog}` : 'SYNC OK';
              this.syncBadgeClass = d.sync_backlog > 0 ? 'bg-yellow-600' : 'bg-green-700';
            } else {
              this.syncBadge = 'SYNC —'; this.syncBadgeClass = 'bg-gray-700';
            }
            this.recBadge = d.recording_active ? 'REC' : 'NO REC';
            this.recBadgeClass = d.recording_active ? 'bg-red-700' : 'bg-gray-700';
            this.activeDriver = d.active_driver;
            this.hardware = d.hardware || [];
            this.systemConditions = d.system_conditions || [];
            if (d.lat != null && d.lng != null) {
              const ll = [d.lat, d.lng];
              if (!this.marker) {
                this.marker = L.circleMarker(ll, { radius: 6, color: '#1f6feb', fillColor: '#1f6feb', fillOpacity: 1 }).addTo(this.map);
                this.map.setView(ll, 13);
              } else {
                this.marker.setLatLng(ll);
              }
              const pts = this.breadcrumb.getLatLngs();
              pts.push(ll);
              if (pts.length > 300) pts.shift();
              this.breadcrumb.setLatLngs(pts);
              this._updateWaypoint(d.lat, d.lng);
            }
          });
        },
        openEvents() {
          const es = new EventSource('/sse/events');
          es.addEventListener('event', (e) => {
            const ev = JSON.parse(e.data);
            // ALERT events go to the overlay only — they are not rally events
            if (ev.type === 'ALERT') {
              this.showAlert(ev);
              return;
            }
            this.events.unshift(ev);
            if (this.events.length > 5) this.events.pop();
            this.showAlert(ev);
            if (ev.lat != null && ev.lng != null) {
              const col = this.EVENT_COLOURS[ev.type] || '#8b949e';
              const label = ev.peak_g ? `${ev.type} · ${ev.peak_g.toFixed(1)}g` : ev.type;
              L.circleMarker([ev.lat, ev.lng], { radius: 6, color: col, fillColor: col, fillOpacity: 0.85 })
                .bindPopup(label)
                .addTo(this.map);
            }
          });
        },
        _haversineKm(lat1, lon1, lat2, lon2) {
          const R = 6371;
          const dLat = (lat2 - lat1) * Math.PI / 180;
          const dLon = (lon2 - lon1) * Math.PI / 180;
          const a = Math.sin(dLat/2)**2 +
                    Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
          return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        },
        _bearingDeg(lat1, lon1, lat2, lon2) {
          const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
          const Δλ = (lon2 - lon1) * Math.PI / 180;
          const y = Math.sin(Δλ) * Math.cos(φ2);
          const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
          return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
        },
        _cardinalPoint(deg) {
          const pts = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
          return pts[Math.round(deg / 22.5) % 16];
        },
        _updateWaypoint(lat, lng) {
          if (lat == null || lng == null) return;
          let best = null, bestDist = Infinity;
          for (const wp of this._waypoints) {
            const d = this._haversineKm(lat, lng, wp.lat, wp.lng);
            if (d < bestDist) { bestDist = d; best = wp; }
          }
          if (best) {
            this.waypointText = `${Math.round(bestDist)} km to ${best.name}`;
            this._bearingToWpDeg = this._bearingDeg(lat, lng, best.lat, best.lng);
            this._renderBearing();
          }
        },
        _renderBearing() {
          if (this._bearingToWpDeg == null) {
            this.bearingText = '--';
            this.bearingArrowDeg = 0;
            return;
          }
          const moving = this.speed >= 5 && this.heading != null;
          const ref = moving ? this.heading : 0;
          const rel = ((this._bearingToWpDeg - ref + 540) % 360) - 180;
          this.bearingArrowDeg = rel;
          if (moving) {
            const abs = Math.round(Math.abs(rel));
            if (abs <= 5) this.bearingText = 'AHEAD';
            else if (abs >= 175) this.bearingText = 'BEHIND';
            else this.bearingText = `${abs}° ${rel < 0 ? 'L' : 'R'}`;
          } else {
            this.bearingText = `${this._cardinalPoint(this._bearingToWpDeg)} · ${Math.round(this._bearingToWpDeg)}°`;
          }
        },
        relativeTime(ts) {
          void this.now; // reference now so Alpine re-renders this when now ticks
          const diff = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
          if (diff < 0) return 'just now';
          if (diff < 60) return `${diff}s ago`;
          const m = Math.floor(diff / 60);
          return m < 60 ? `${m}m ago` : `${Math.floor(m/60)}h ${m%60}m ago`;
        },
        drawGauge() {
          const c = document.getElementById('ggauge');
          if (!c) return;
          const ctx = c.getContext('2d');
          const w = c.width, h = c.height, cx = w/2, cy = h/2, r = Math.min(w,h)/2 - 10;
          ctx.clearRect(0,0,w,h);
          ctx.strokeStyle = '#21262d'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx-r,cy); ctx.lineTo(cx+r,cy); ctx.moveTo(cx,cy-r); ctx.lineTo(cx,cy+r); ctx.stroke();
          // dot position scaled by auto-range peak
          const px = cx + (this.gx / this.peakG) * r;
          const py = cy - (this.gy / this.peakG) * r;
          ctx.fillStyle = '#1f6feb';
          ctx.beginPath(); ctx.arc(px, py, 8, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#8b949e'; ctx.font = '18px system-ui';
          ctx.fillText(`±${this.peakG.toFixed(1)}g`, 10, 20);
          requestAnimationFrame(() => this.drawGauge());
        },
        async fetchGpsStatus() {
          try {
            const r = await fetch('/api/logbook/gps');
            const data = await r.json();
            this.gpsHasFix = data.has_fix;
            this.gpsStaleMinutes = data.stale_seconds != null
              ? Math.max(1, Math.round(data.stale_seconds / 60)) : 0;
          } catch { this.gpsHasFix = false; this.gpsStaleMinutes = 0; }
        },
        async openNoteModal() {
          this.errorMsg = '';
          this.noteBody = '';
          this.noteEventId = '';
          await this.fetchGpsStatus();
          this.showNoteModal = true;
        },
        async openFuelModal() {
          this.errorMsg = '';
          this.fuelVolume = '';
          this.fuelCost = '';
          this.fuelOdo = '';
          await this.fetchGpsStatus();
          this.showFuelModal = true;
        },
        async saveNote() {
          if (!this.noteBody.trim()) return;
          this.savingNote = true;
          this.errorMsg = '';
          try {
            const body = { body: this.noteBody };
            if (this.noteEventId) body.event_id = parseInt(this.noteEventId, 10);
            const r = await fetch('/api/notes', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify(body)
            });
            if (!r.ok) throw new Error('save failed');
            this.showNoteModal = false;
            this.flashSuccess('Note saved');
          } catch {
            this.errorMsg = 'Could not save — try again';
          } finally { this.savingNote = false; }
        },
        async saveFuel() {
          const vol = parseFloat(this.fuelVolume);
          if (!(vol > 0)) return;
          this.savingFuel = true;
          this.errorMsg = '';
          try {
            const body = { volume_litres: vol };
            if (this.fuelCost) body.cost_aud = parseFloat(this.fuelCost);
            if (this.fuelOdo) body.odometer_km = parseFloat(this.fuelOdo);
            const r = await fetch('/api/fuel', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify(body)
            });
            if (!r.ok) throw new Error('save failed');
            this.showFuelModal = false;
            this.flashSuccess('Fuel stop logged');
          } catch {
            this.errorMsg = 'Could not save — try again';
          } finally { this.savingFuel = false; }
        },
        async openDriverModal() {
          try {
            const r = await fetch('/api/driver/stats');
            if (r.ok) {
              const data = await r.json();
              this.driverStats = data.drivers || [];
              this.driverRoster = data.roster || [];
              this.driverSelection = data.active_driver || '';
            }
          } catch (e) { console.error('driver stats fetch failed', e); }
          this.showDriverModal = true;
        },
        async switchDriver(name) {
          try {
            const r = await fetch('/api/driver', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({name: name}),
            });
            if (r.ok) {
              const data = await r.json();
              this.activeDriver = data.driver_name;
              // Refresh stats so the modal reflects the new stint
              const s = await fetch('/api/driver/stats');
              if (s.ok) {
                const sd = await s.json();
                this.driverStats = sd.drivers || [];
              }
            } else {
              console.warn('driver switch rejected', r.status);
            }
          } catch (e) { console.error('driver switch failed', e); }
        },
        formatDuration(seconds) {
          if (!seconds || seconds <= 0) return '0m';
          const h = Math.floor(seconds / 3600);
          const m = Math.floor((seconds % 3600) / 60);
          return h > 0 ? `${h}h ${m}m` : `${m}m`;
        },
        flashSuccess(msg) {
          this.successMsg = msg;
          setTimeout(() => { this.successMsg = ''; }, 3000);
        },
        openHardwareModal() { this.showHardwareModal = true; },
        hwBadgeClass() {
          const h = this.hardware;
          const sc = this.systemConditions || [];
          // Any active system condition → red (mirrors critical missing hardware)
          if (sc.some(r => r.state === 'active')) return 'bg-red-700';
          if (!h.length) return 'bg-gray-700';
          if (h.some(r => r.tier === 'critical' && r.state === 'missing')) return 'bg-red-700';
          if (h.some(r => r.tier === 'important' && r.state === 'missing')) return 'bg-yellow-600';
          if (h.some(r => r.state === 'degraded' || r.state === 'recovering'))
            return 'bg-yellow-600';
          return 'bg-green-700';
        },
        hwStatusTitle() {
          const crit = this.criticalMissing();
          if (crit) return 'CRITICAL: ' + crit + ' OFFLINE';
          const imp = this.hardware
            .filter(r => r.tier === 'important' && r.state === 'missing')
            .map(r => r.label).join(', ');
          if (imp) return 'Important: ' + imp + ' offline';
          if (!this.hardware.length) return 'Hardware manifest not loaded';
          return 'All hardware present';
        },
        // Hardware panel helpers (Phase 21, HW-02/HW-03)
        criticalMissing() {
          const labels = this.hardware
            .filter(r => r.tier === 'critical' && r.state === 'missing')
            .map(r => r.label.toUpperCase());
          return labels.join(', ');
        },
        sortedHardware() {
          const order = { critical: 0, important: 1, best_effort: 2 };
          return this.hardware.slice().sort((a, b) =>
            (order[a.tier] - order[b.tier]) || a.role.localeCompare(b.role)
          );
        },
        beRollup() {
          const be = this.hardware.filter(r => r.tier === 'best_effort');
          return { present: be.filter(r => r.state === 'present').length, total: be.length };
        },
        stateText(state) {
          return { present: 'PRESENT', degraded: 'RECOVERING', missing: 'OFFLINE' }[state]
            || state.toUpperCase();
        },
        stateGlyph(state) {
          return { present: '●', degraded: '◐', missing: '○' }[state] || '?';
        },
        scStateText(state) {
          return { clear: 'CLEAR', active: 'ACTIVE', recovering: 'RECOVERING', restored: 'RESTORED' }[state]
            || (state || 'CLEAR').toUpperCase();
        },
        scGlyph(state) {
          return { clear: '○', active: '●', recovering: '◐', restored: '●' }[state] || '?';
        },
        sinceText(ms) {
          if (ms == null) return '—';
          if (ms < 60000) return `${Math.floor(ms / 1000)}s`;
          if (ms < 3600000) return `${Math.floor(ms / 60000)}m`;
          return `${Math.floor(ms / 3600000)}h`;
        },
      };
    }
  </script>
</body>
</html>
