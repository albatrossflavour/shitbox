# Shitbox Rally Telemetry Configuration

app:
  name: shitbox-telemetry
  log_level: INFO
  data_dir: /var/lib/shitbox

sensors:
  gps:
    enabled: true
    host: localhost # gpsd host
    port: 2947 # gpsd port
    sample_rate_hz: 1
    location_resolution_interval_seconds: 300
    rally_start_lat: -16.4838
    rally_start_lon: 145.4673
    rally_destination_lat: -37.8679
    rally_destination_lon: 144.9743
    route:
      waypoints:
        - name: "Port Douglas"
          day: 1
          lat: -16.4838
          lon: 145.4673
        - name: "The Oasis Roadhouse"
          day: 1
          lat: -18.8797
          lon: 144.5436
        - name: "Aramac"
          day: 2
          lat: -22.9667
          lon: 145.2333
        - name: "Toompine"
          day: 3
          lat: -27.8500
          lon: 144.4833
        - name: "Louth"
          day: 4
          lat: -30.5333
          lon: 145.1167
        - name: "Narrandera"
          day: 5
          lat: -34.7475
          lon: 146.5533
        - name: "Dargo"
          day: 6
          lat: -37.4975
          lon: 147.2692
        - name: "Melbourne"
          day: 7
          lat: -37.8679
          lon: 144.9743

  imu:
    enabled: true
    i2c_bus: 1
    address: 0x68
    sample_rate_hz: 10
    # Accelerometer range: 2, 4, 8, or 16 (g)
    accel_range: 4
    # Gyroscope range: 250, 500, 1000, or 2000 (deg/s)
    gyro_range: 500

  temperature:
    enabled: false # Enable when MCP9808 is wired
    i2c_bus: 1
    address: 0x18
    sample_rate_hz: 0.1

  power:
    enabled: false
    i2c_bus: 1
    address: 0x40
    sample_rate_hz: 1.0

  environment:
    enabled: true
    i2c_bus: 1
    address: 0x77
    sample_rate_hz: 1.0

storage:
  database_path: /var/lib/shitbox/telemetry.db
  backup_enabled: true
  backup_interval_hours: 6
  max_backups: 10

sync:
  # Master switch for all uplink - set false when going offline
  uplink_enabled: true

  mqtt:
    enabled: false # Disabled - using batch sync only to avoid duplicate metrics
    broker_host: emqx.albatrossflavour.com
    broker_port: 1883
    username: mqtt
    password: Mc2KMw2GHZgzpnnBcQqs
    client_id: shitbox-car
    qos: 1
    topic_prefix: shitbox
    # Reconnect settings
    reconnect_delay_min: 1
    reconnect_delay_max: 120

  prometheus:
    enabled: true
    remote_write_url: http://prometheus.albatrossflavour.com/api/v1/write
    batch_size: 2000
    batch_interval_seconds: 15

  connectivity:
    # Check prometheus host - requires WireGuard to be up
    check_host: prometheus.albatrossflavour.com
    check_port: 80
    check_interval_seconds: 30
    timeout_seconds: 3

  grafana:
    enabled: false
    url: "https://shit-of-theseus.com"
    api_token: ""
    video_base_url: "https://shit-of-theseus.com/captures"
    timeout_seconds: 5

  capture_sync:
    enabled: true
    remote_dest: "tgreen@192.168.1.22:/volume2/apps/shitbox/"
    rsync_path: "/opt/bin/rsync"
    interval_seconds: 300

health:
  enabled: true
  report_interval_seconds: 60
  temp_warning_celsius: 70
  temp_critical_celsius: 80
  disk_warning_percent: 80
  disk_critical_percent: 95

display:
  oled:
    enabled: true
    i2c_bus: 1
    address: 0x3C
    update_interval_seconds: 1.0

capture:
  enabled: true
  buzzer_enabled: true
  gpio_pin: 17
  debounce_ms: 50
  pre_capture_seconds: 30
  post_capture_seconds: 30
  captures_dir: /var/lib/shitbox/captures
  max_capture_age_days: 14
  video:
    device: /dev/video0
    duration_seconds: 60
    resolution: 1280x720
    fps: 30
    audio_device: plughw:CARD=Camera,DEV=0
  timelapse:
    enabled: true
    interval_seconds: 60
    min_speed_kmh: 5.0
  video_buffer:
    enabled: true
    buffer_dir: /var/lib/shitbox/video_buffer
    segment_seconds: 10
    buffer_segments: 5
    overlay_enabled: true
    intro_video: "/var/lib/shitbox/intro.mp4"
  speaker:
    enabled: true
    model_path: /var/lib/shitbox/tts/en_GB-northern_english_male-medium.onnx
    distance_announce_interval_km: 50
