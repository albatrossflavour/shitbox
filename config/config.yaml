# Shitbox v2 telemetry config
#
# Canonical hardware reference: ~/Brain/projects/shitbox-rally-2026.md
# This file is the CODE's view of the hardware. The brain note is the
# source of truth for wiring, addresses, and intent. If they disagree,
# the brain note wins — update this file to match.

app:
  name: shitbox-telemetry
  log_level: INFO
  data_dir: /var/lib/shitbox

sensors:
  gps:
    enabled: true
    host: localhost # gpsd host
    port: 2947 # gpsd port
    sample_rate_hz: 1
    location_resolution_interval_seconds: 300
    rally_start_lat: -16.4838
    rally_start_lon: 145.4673
    rally_destination_lat: -37.8679
    rally_destination_lon: 144.9743
    rally_start_date: "2026-07-11"  # Route map shows only today's drive before this date; full rally from this date onward
    route:
      waypoints:
        - name: "Port Douglas"
          day: 1
          lat: -16.4838
          lon: 145.4673
        - name: "The Oasis Roadhouse"
          day: 1
          lat: -18.8797
          lon: 144.5436
        - name: "Aramac"
          day: 2
          lat: -22.9667
          lon: 145.2333
        - name: "Toompine"
          day: 3
          lat: -27.8500
          lon: 144.4833
        - name: "Louth"
          day: 4
          lat: -30.5333
          lon: 145.1167
        - name: "Narrandera"
          day: 5
          lat: -34.7475
          lon: 146.5533
        - name: "Dargo"
          day: 6
          lat: -37.4975
          lon: 147.2692
        - name: "Melbourne"
          day: 7
          lat: -37.8679
          lon: 144.9743
        # Return leg — drive home after rally. `leg: return` keeps these out of
        # the rally progress count on status screens but still drives tile
        # corridor generation and waypoint-reached announcements.
        - name: "Goulburn"
          day: 8
          lat: -34.7537
          lon: 149.7179
          leg: return
        - name: "Camden"
          day: 8
          lat: -34.0545
          lon: 150.6953
          leg: return
        - name: "Newcastle"
          day: 9
          lat: -32.9283
          lon: 151.7817
          leg: return
        - name: "Coffs Harbour"
          day: 9
          lat: -30.2963
          lon: 153.1157
          leg: return
        - name: "Brisbane"
          day: 10
          lat: -27.4705
          lon: 153.0260
          leg: return
        - name: "Rockhampton"
          day: 10
          lat: -23.3791
          lon: 150.5100
          leg: return
        - name: "Mackay"
          day: 11
          lat: -21.1425
          lon: 149.1821
          leg: return
        - name: "Port Douglas (home)"
          day: 11
          lat: -16.4838
          lon: 145.4673
          leg: return

  tca4307: # I2C bus buffer — software recovery via EN pin pulse
    # GPIO wired to the TCA4307 EN pin. Driven HIGH at sampler setup; pulsed
    # LOW briefly during _i2c_bus_reset to clear protective-isolation latches
    # without a reboot. The TCA latches on stuck-low / undervoltage /
    # contention and only releases on EN low→high or a real VCC drop —
    # systemctl reboot doesn't cycle the rail on Pi 5 (PMIC keeps it alive),
    # so EN is the only software path back from a wedged bus.
    en_gpio: 12
    # Bumped 10 → 100 ms after the 2026-04-29 stress test reproduced a wedge
    # that the 10 ms pulse couldn't clear. Datasheet says > 1 µs is enough,
    # but margin is cheap; if 100 ms still doesn't recover we have stronger
    # evidence the fault isn't actually a TCA latch (slave-state-hang
    # theory) and the right fix is elsewhere.
    pulse_low_ms: 100

  lsm6dsox: # LSM6DSOX accel+gyro at 0x6A (replaces MPU6050)
    enabled: true
    i2c_bus: 1
    address: 0x6A
    # Application poll rate, retargeted 22-07 from 104 -> 25 Hz.
    # Sensor ODR stays at 208 Hz internally (CTRL1_XL=0x52, CTRL2_G=0x54) for
    # aliasing suppression via LPF2 at ODR/10. Documented acceptance floor is 10 Hz
    # (REQUIREMENTS.md IMU-02) -- values at or above 10 Hz satisfy the requirement;
    # 25 Hz leaves margin for detector sustain gates
    # (ROLLOVER 150 ms = 3-4 samples, BIG_CORNER 300 ms = 7-8, HARD_BRAKE 200 ms = 5).
    sample_rate_hz: 25.0
    accel_offset_x: 0.0          # seed; auto-zero overwrites via trip_state
    accel_offset_y: 0.0
    accel_offset_z: 0.0
    accel_scale_x: -1.0          # chip mounted 180° around Z (back-to-front); flip X and Y
    accel_scale_y: -1.0
    accel_scale_z: 1.0
    # Phase 22 auto-zero (IMU-05, IMU-06)
    auto_zero_enabled: true
    auto_zero_stationary_kmh: 1.0
    auto_zero_window_seconds: 30.0
    auto_zero_tolerance_g: 0.05
    auto_zero_max_abs_g: 0.5
    auto_zero_motion_reject_g: 0.2
    # Added by 22-03 (IMU-05 per-sample + stddev guards):
    auto_zero_motion_stddev_g: 0.20

  lis3mdl: # LIS3MDL magnetometer at 0x1C
    enabled: true
    i2c_bus: 1
    address: 0x1C

  imu_heading: # complementary filter output
    enabled: true
    sample_rate_hz: 10.0
    complementary_alpha: 0.98

  environment: # BME680 at 0x77 (NOT BME280)
    enabled: true
    i2c_bus: 1
    address: 0x77
    sample_rate_hz: 1.0

  temperature: # DS18B20 1-Wire, 2 probes (IDs from HARDWARE_IDS.md)
    enabled: true
    sample_rate_hz: 0.1  # every 10s — 1Hz races the Pi 5 kernel conversion
    probes:
      - role: exterior
        sensor_id: "00000024263a"
      - role: engine_bay
        sensor_id: "0000002405b1"

  light: # VEML7700 ambient light at 0x10
    enabled: true
    sample_rate_hz: 1.0
    i2c_bus: 1
    address: 0x10

  particulate: # SEN0460 PM2.5 at 0x19
    enabled: true
    i2c_bus: 1
    address: 0x19
    sample_rate_hz: 1.0

  # 12 V battery rail — INA228 at 0x40, Adafruit breakout with 15 mΩ
  # shunt (±10 A range). 20-bit precision, has on-chip energy/charge
  # accumulators we don't currently consume.
  power_battery:
    enabled: true
    chip: ina228
    i2c_bus: 1
    address: 0x40
    shunt_ohms: 0.015
    max_expected_amps: 10.0
    sample_rate_hz: 1.0
    # Drop readings below this — chip is alive on I2C but V+/V- are
    # currently floating, so the ADC reads its own noise floor (~mV).
    # 1.0 V is well below any real DC rail (12 V battery seen at ~12 V,
    # AGM dead at ~10 V) and well above the noise floor.
    disconnected_threshold_v: 1.0

  # Pi 5 internal rail telemetry via `vcgencmd pmic_read_adc` — covers
  # EXT5V input, 3V3_SYS, VDD_CORE, DDR_*, HDMI, etc. Replaces the
  # earlier external INA237-on-5V-rail attempt: putting an inline shunt
  # in the Pi's 5 V supply path cost too much voltage headroom and
  # tripped undervoltage warnings under load. The PMIC measures
  # everything that chip would have, with zero added series resistance.
  pmic:
    enabled: true
    sample_rate_hz: 1.0

storage:
  database_path: /var/lib/shitbox/telemetry.db
  backup_enabled: true
  backup_interval_hours: 6
  max_backups: 10
  home_lat: 0.0
  home_lng: 0.0
  home_exclusion_radius_m: 2000

sync:
  # Master switch for all uplink - set false when going offline
  uplink_enabled: true

  mqtt:
    enabled: false # Disabled - using batch sync only to avoid duplicate metrics
    broker_host: emqx.albatrossflavour.com
    broker_port: 1883
    username: mqtt
    password: Mc2KMw2GHZgzpnnBcQqs
    client_id: shitbox-car
    qos: 1
    topic_prefix: shitbox
    # Reconnect settings
    reconnect_delay_min: 1
    reconnect_delay_max: 120

  prometheus:
    enabled: true
    remote_write_url: http://prometheus.albatrossflavour.com/api/v1/write
    batch_size: 2000
    batch_interval_seconds: 15

  connectivity:
    # Check prometheus host - requires WireGuard to be up
    check_host: prometheus.albatrossflavour.com
    check_port: 80
    check_interval_seconds: 30
    timeout_seconds: 3

  grafana:
    enabled: true
    url: "https://grafana.shit-of-theseus.com"
    username: "admin"
    password_file: "/etc/shitbox/grafana-password"
    video_base_url: "https://shit-of-theseus.com/captures"
    timeout_seconds: 5

  capture_sync:
    enabled: true
    remote_dest: "tgreen@192.168.1.22:/volume2/apps/shitbox/"
    rsync_path: "/opt/bin/rsync"
    interval_seconds: 300

health:
  enabled: true
  report_interval_seconds: 60
  temp_warning_celsius: 70
  temp_critical_celsius: 80
  disk_warning_percent: 80
  disk_critical_percent: 95

display:
  oled: # SSD1306 at 0x3C — optional, not wired in v2 by default
    enabled: true
    i2c_bus: 1
    address: 0x3C
    update_interval_seconds: 1.0

dashboard:
  enabled: true # in-process FastAPI on the Pi (http://localhost:8080)
  host: 0.0.0.0
  port: 8080
  mbtiles_path: /var/lib/shitbox/tiles/rally.mbtiles
  max_sse_clients: 8

capture:
  enabled: true
  buzzer_enabled: true  # PiicoDev piezo buzzer at fixed I2C 0x5C
  gpio_pin: 17
  debounce_ms: 50
  pre_capture_seconds: 15
  post_capture_seconds: 45
  captures_dir: /var/lib/shitbox/captures
  max_capture_age_days: 14
  video:
    device: /dev/video0
    duration_seconds: 60
    resolution: 1280x720
    fps: 30
    audio_device: "plughw:CARD=B100,DEV=0"  # Brio 100 built-in mic (cabin camera)
  timelapse:
    enabled: true
    interval_seconds: 30
    min_speed_kmh: 5.0
  video_buffer:
    enabled: true
    device: /dev/camera-front # ELP 4K IMX317 (front-facing, D-13)
    input_format: h264
    resolution: 1920x1080
    fps: 30
    buffer_dir: /var/lib/shitbox/video_buffer
    segment_seconds: 10
    buffer_segments: 5
    overlay_enabled: true
    intro_video: "/var/lib/shitbox/intro.mp4"
    camera_controls:
      # ELP 4K IMX317 controls — retuned from UGREEN (D-13)
      brightness: 0
      contrast: 32
      saturation: 60
      exposure_auto: 3
    pip:
      enabled: true
      device: /dev/camera-cabin # Logitech Brio 100 (cabin-facing, D-14)
      input_format: mjpeg
      resolution: 640x480
      fps: 15
      position: bottom_right
      # 0.35 → ~14% of the 1920×1080 output frame. 0.85 was the previous
      # value (~32%) and blocked the road. Bigger is busier; a sane corner
      # thumbnail sits around 0.3–0.4.
      scale: 0.35
      camera_controls:
        # DEFERRED — tune on Pi with: v4l2-ctl -d /dev/camera-cabin -L
        # Then set controls: v4l2-ctl -d /dev/camera-cabin --set-ctrl <name>=<value>
        # Defaults below are Brio 100 factory; adjust to fix washed-out/orange cast.
        white_balance_automatic: 1
        brightness: 128
        contrast: 128
        saturation: 128
  speaker:
    enabled: true
    model_path: /var/lib/shitbox/tts/en_GB-northern_english_male-medium.onnx
    distance_announce_interval_km: 50
    volume: 90
  # Event video title-card slate (phase 26 / D-01, D-09, D-12, D-16).
  # Flip enabled to false if slates start misbehaving in the field.
  title_card:
    enabled: true
    duration_seconds: 3.0
    show_driver: true
    # Whimsy pool used when GPS has no fix at save time (D-09). Overrides
    # the defaults baked into title_card.py if set. One line is picked
    # per slate; no round-robin state.
    whimsy_lines:
      - "Here be dragons"
      - "GPS off having a lie down"
      - "Somewhere between A and B"
      - "The map ends here"
      - "Lost, but enthusiastic"

# Driver roster for Phase 13 driver tracking. Change this file to change the roster.
drivers:
  - Tony
  - Steve

# ── TPMS (Phase 28) ─────────────────────────────────────────────
# Aftermarket 433 MHz TPMS via rtl_433 -R 156 (Abarth-124Spider /
# VDO-TG1C). Pressure correction × 2.45 empirically calibrated against
# four fitted tyres at 31-32 PSI on 2026-04-28; refine if a future
# bench session shows individual sensor drift.
tpms:
  enabled: true
  rtl433_protocol_id: 156
  rf_frequency_hz: 433920000
  # 0 (or any value <= 0) tells rtl_433 to use its built-in AGC. Bench
  # 2026-04-28 with the loaner RTL2838: -g 30 → 0 frames in 20s, AGC →
  # 3 frames in 20s. AGC also tolerates the R820T PLL-not-locked startup
  # warning. Set to a positive dB only if you have a known-good RF
  # environment where a fixed step beats AGC.
  rf_gain_db: 0
  pressure_correction_factor: 2.45
  low_pressure_yellow_psi: 28
  low_pressure_red_psi: 25
  leak_window_seconds: 60
  leak_drop_psi: 5
  stale_timeout_seconds: 600
  sustain_required: 2
  usb_vid_pid: "0bda:2838"
  sensors:
    - id: "550b57d9"
      position: front-driver
    - id: "54d96e8f"
      position: front-passenger
    - id: "550d14ed"
      position: rear-driver
    - id: "550b5d8a"
      position: rear-passenger

hardware:
  # Each entry declares expected hardware. Boot probe verifies and records
  # PRESENT/MISSING into HardwareState. Existing sensor blocks (sensors.imu,
  # sensors.environment, etc.) keep their tuning knobs; this block is
  # presence metadata only.
  devices:
    # ── critical ─────────────────────────────────────────────────────────
    - role: imu
      bus: i2c-1
      address: 0x6a
      criticality: critical
      description: "LSM6DSOX accel+gyro"
    - role: camera_front
      bus: usb
      path: /dev/camera-front
      criticality: critical
      description: "ELP 4K IMX317 (front dashcam)"

    # ── important ────────────────────────────────────────────────────────
    - role: power_battery
      bus: i2c-1
      address: 0x40
      criticality: important
      description: "INA228 power monitor — 12 V battery rail"
    - role: gps
      bus: usb
      path: /dev/gps0
      criticality: important
      description: "U-blox USB GPS via gpsd"

    # ── best_effort ──────────────────────────────────────────────────────
    - role: environment
      bus: i2c-1
      address: 0x77
      criticality: best_effort
      description: "BME680 temperature/humidity/pressure/gas"
    - role: magnetometer
      bus: i2c-1
      address: 0x1c
      criticality: best_effort
      description: "LIS3MDL magnetometer"
    - role: light
      bus: i2c-1
      address: 0x10
      criticality: best_effort
      description: "VEML7700 ambient light"
    - role: oled
      bus: i2c-1
      address: 0x3c
      criticality: best_effort
      description: "SSD1306 128x64 status display"
    - role: temp_exterior
      bus: 1-wire
      sensor_id: "28-00000024263a"
      criticality: best_effort
      description: "DS18B20 exterior probe"
    - role: temp_engine_bay
      bus: 1-wire
      sensor_id: "28-0000002405b1"
      criticality: best_effort
      description: "DS18B20 engine bay probe"
    - role: camera_cabin
      bus: usb
      path: /dev/camera-cabin
      criticality: best_effort
      description: "Logitech Brio 100 (cabin)"
    - role: tts_speaker
      bus: audio
      label: UACDemo
      criticality: best_effort
      description: "Jieli UACDemoV1.0 USB speaker (TTS output)"
    - role: audio_cabin_mic
      bus: audio
      label: B100
      criticality: best_effort
      description: "Logitech Brio 100 built-in mic (cabin audio)"
    - role: button
      bus: gpio
      pin: 17
      criticality: best_effort
      description: "Manual capture button"
    - role: display_hdmi
      bus: hdmi
      # Port-agnostic: match any HDMI-A-N so the probe survives cable swaps
      # between HDMI-A-1 and HDMI-A-2 without a config edit.
      connector: HDMI-A-*
      criticality: best_effort
      description: "7in kiosk display"
    - role: tpms_radio
      bus: usb_vid_pid
      path: "0bda:2838"
      criticality: best_effort
      description: "Nooelec NESDR Smart v5 (RTL2832U + R820T2) — 433 MHz tyre pressure receiver"
